<!DOCTYPE html>
<html>
<head>
    <title>AI Text Summarizer</title>
</head>
<body>

<h2>🤖 AI Text Summarizer</h2>

<!-- Input form -->
<form action="/summarize" method="post">
    <textarea 
        name="text" 
        rows="10" 
        cols="60" 
        placeholder="Paste your long text here..."></textarea>
    <br><br>
    <button type="submit">Summarize</button>
</form>

<hr>

<!-- Show original text -->
{% if original_text %}
    <h3>📝 Original Text:</h3>
    <p>{{ original_text }}</p>
{% endif %}

<!-- Show summary -->
{% if summary %}
    <h3>✨ Summary:</h3>
    <p><b>{{ summary }}</b></p>
{% endif %}

</body>
</html>
